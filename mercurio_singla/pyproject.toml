[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conjunction-screening"
version = "0.1.0"
description = "Mercurio-Singla K-d tree-based conjunction screening with pluggable probabilistic distances"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["conjunction_screening*"]
